<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siparişler</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            color: #000000;
            font-size: 17px; /* Görseldeki font boyutuna uygun */
        }

        h1 {
            font-size: 34px;
            font-weight: 700;
            color: #1a1a1a;
            margin-top: 10px;
            margin-bottom: 30px;
            line-height: 1.1;
        }

        .order-card {
            border: 1px solid #e5e5e5;
            padding: 25px 20px;
            margin-bottom: 20px;
            background-color: #ffffff;
        }

        .row {
            display: flex;
            margin-bottom: 22px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .label {
            font-weight: 600; /* Yazı kalınlığı */
            width: 155px; /* Etiketlerin hizalanması için sabit genişlik */
            flex-shrink: 0;
            color: #1a1a1a;
        }

        .value {
            flex-grow: 1;
            color: #333333;
        }

        .link {
            color: #2b7bd6; /* Görseldeki mavi tonu */
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Geçmiş<br>Siparişler</h1>

    <div class="order-card">
        <div class="row">
            <div class="label">Sipariş #:</div>
            <div class="value">GRO000626251</div>
        </div>
        <div class="row">
            <div class="label">Tarih:</div>
            <div class="value">18.10.2026</div>
        </div>
        <div class="row">
            <div class="label">Gönderim Adresi:</div>
            <div class="value">Halil Kaya</div>
        </div>
        <div class="row">
            <div class="label">Sipariş Toplamı:</div>
            <div class="value">276.449,03 TL</div>
        </div>
        <div class="row">
            <div class="label">Durum:</div>
            <div class="value">Ödeme Onaylandı</div>
        </div>
        <div class="row">
            <div class="label">İşlemler:</div>
            <div class="value"><a class="link" href="#">Siparişi Göster</a></div>
        </div>
    </div>

</body>
</html>
